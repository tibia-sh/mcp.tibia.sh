name: ci

# Runs on pull requests, and as the reusable workflow deploy.yml calls on the commit it deploys.
# No job reads a secret, so every pull request runs every check. The job IDs are the
# ruleset's required checks, so no job has a name: or an if:.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      # This setup-node caches by itself whenever package.json names a packageManager, so it is
      # switched off by name.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '26'
          package-manager-cache: false
      # Installs the pnpm that packageManager names, then runs `pnpm install --frozen-lockfile`.
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          install: true
          require-lockfile: true
      # Signatures are verified once per run, here. The other jobs install the same lockfile.
      - run: pnpm audit signatures
      # pnpm applies the release age when it resolves a version, and checks the lockfile against it
      # again when it installs, memoized per lockfile content in the record pnpm/setup restores. This
      # judges every entry on every run, verifies each first-party pin's provenance against its
      # release workflow, and holds each first-party package to one copy, which no pnpm setting does.
      - run: pnpm run check:lockfile
      - run: pnpm run typecheck
      - run: pnpm run test:unit

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '26'
          package-manager-cache: false
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          install: true
          require-lockfile: true
      # Builds the image, runs it, and checks what it serves over HTTP.
      - run: pnpm run test:container

  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '26'
          package-manager-cache: false
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          install: true
          require-lockfile: true
      # wrangler types --check, then a deploy dry run, which bundles the Worker and builds the
      # image without an account.
      - run: pnpm run check:config
      # The Worker end to end in wrangler dev, with local containers.
      - run: pnpm run test:worker
