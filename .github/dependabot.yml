version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: daily }
    groups:
      tibia-sh: { patterns: ["@tibia.sh/*"] }
    cooldown:
      default-days: 7
      exclude: ["@tibia.sh/*"]
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
